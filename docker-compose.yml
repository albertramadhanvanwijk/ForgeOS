version: '3.8'

services:
  # Primary Relational Store + Vector Embeddings for Persistent Memory
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeos
      POSTGRES_USER: forgeos
      POSTGRES_PASSWORD: forgeos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeos -d forgeos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # High-Throughput Event Queue & Workflow Checkpoints
  redis:
    image: redis:7-alpine
    container_name: forgeos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-Compatible Object Storage for Artifact Registry & Snapshots
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: forgeos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: forgeos_admin
      MINIO_ROOT_PASSWORD: forgeos_storage_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
